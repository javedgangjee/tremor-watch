<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Tremor log viewer</title>
  <link rel="stylesheet" href="design/colors.css">
  <link rel="stylesheet" href="design/typography-spacing-fonts.css">
  <link rel="stylesheet" href="design/components.css">
  <link rel="stylesheet" href="../../node_modules/uplot/dist/uPlot.min.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <p class="wordmark">Tremor log</p>
      <div class="header-actions">
        <button id="open" type="button" class="md-btn md-btn-secondary md-btn-md">
          <svg class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7 L4 18.5 L20 18.5 L20 9 L11.5 9 L9.5 6 L4 6 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Open recording</span>
        </button>
        <button id="record" type="button" class="md-btn md-btn-primary md-btn-md">
          <svg id="record-icon-play" class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5.5 L18 12 L8 18.5 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg id="record-icon-stop" class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><path d="M7 7 L17 7 L17 17 L7 17 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg id="record-icon-loader" class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><path d="M12 4 A8 8 0 1 1 4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="record-label">Record</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="record-status" class="record-status" role="status" hidden>
      <svg id="record-status-icon" class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><path d="M12 4 A8 8 0 1 1 11.99 4 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9.5 L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 9.5 L9.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="record-text" class="md-notice-main"></span>
    </div>

    <div id="message" class="md-notice md-notice-danger" role="alert" hidden>
      <svg class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4 A8 8 0 1 1 11.99 4 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9.5 L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 9.5 L9.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="md-notice-main">
        <div class="md-notice-title">The viewer cannot show this file</div>
        <div id="message-text" class="message-text"></div>
      </div>
    </div>

    <section id="empty" class="md-card empty-card">
      <p class="body">Open a recording that <code>tools/watch_cli.py record</code> saved.</p>
    </section>

    <div id="boot-picker" class="boot-picker" hidden>
      <label class="md-sr-only" for="boot">Boot</label>
      <select id="boot" class="md-input"></select>
      <svg class="md-icon select-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9 L12 15 L18 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div id="cut-short" class="md-notice md-notice-warning" role="status" hidden>
      <svg class="md-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5 L20.5 19 L3.5 19 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 10 L12 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.25 L12 16.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="md-notice-main">This file was cut short, so the viewer shows it up to the cut.</div>
    </div>

    <div id="boot-view" class="boot-view" hidden>
      <section id="chart-card" class="md-card md-card-flush chart-card" aria-label="Gyroscope chart" hidden>
        <header class="md-card-head chart-head">
          <div class="chart-title">
            <h2 class="md-card-title">Gyroscope</h2>
            <span class="chart-unit">°/s</span>
          </div>
          <div class="chart-controls">
            <div id="chips" class="chips" role="group" aria-label="Axes">
              <button type="button" class="md-chip md-chip-on" aria-pressed="true" data-axis="x">
                <svg class="md-icon chip-check" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="chip-text"><span class="axis-line axis-line-x"></span>x</span>
              </button>
              <button type="button" class="md-chip md-chip-on" aria-pressed="true" data-axis="y">
                <svg class="md-icon chip-check" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="chip-text"><span class="axis-line axis-line-y"></span>y</span>
              </button>
              <button type="button" class="md-chip md-chip-on" aria-pressed="true" data-axis="z">
                <svg class="md-icon chip-check" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="chip-text"><span class="axis-line axis-line-z"></span>z</span>
              </button>
            </div>
            <div id="layout" class="md-seg" role="radiogroup" aria-label="Chart layout">
              <button type="button" class="md-seg-opt md-seg-on" role="radio" aria-checked="true" tabindex="0" data-layout="overlaid">Overlaid</button>
              <button type="button" class="md-seg-opt" role="radio" aria-checked="false" tabindex="-1" data-layout="stacked">Stacked</button>
            </div>
          </div>
        </header>

        <div id="chart-body" class="chart-body">
          <div class="toolbar">
            <div class="toolbar-start">
              <button id="earlier" type="button" class="md-btn md-btn-ghost md-btn-sm md-btn-icononly" aria-label="Earlier">
                <svg class="md-icon earlier-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9 L12 15 L18 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <p id="selection-text" class="selection-text" role="status"></p>
            </div>
            <div id="span" class="md-seg" role="radiogroup" aria-label="Time span">
              <button type="button" class="md-seg-opt" role="radio" aria-checked="false" tabindex="-1" data-span="10">10 s</button>
              <button type="button" class="md-seg-opt" role="radio" aria-checked="false" tabindex="-1" data-span="30">30 s</button>
              <button type="button" class="md-seg-opt" role="radio" aria-checked="false" tabindex="-1" data-span="60">1 min</button>
              <button type="button" class="md-seg-opt md-seg-on" role="radio" aria-checked="true" tabindex="0" data-span="all">All</button>
            </div>
          </div>
          <div id="plots" class="plots"></div>
          <div id="answer-line" class="answer-line">
            <span class="answer-label">Answer</span>
            <div id="answer-row" class="answer-row" tabindex="0" role="group" aria-label="Window answers">
              <canvas id="answer-canvas" class="answer-canvas"></canvas>
            </div>
          </div>
          <div id="time-line" class="time-line">
            <span></span>
            <div id="time-labels" class="time-labels"></div>
          </div>
          <p id="no-readings" class="no-readings" hidden>This boot holds no readings.</p>
          <div id="readout" class="readout" aria-hidden="true" hidden>
            <div id="readout-time" class="readout-time"></div>
            <div class="readout-values">
              <span class="readout-axis" data-axis="x"><span class="axis-line axis-line-x"></span>x</span><span id="readout-x" class="readout-value" data-axis="x"></span>
              <span class="readout-axis" data-axis="y"><span class="axis-line axis-line-y"></span>y</span><span id="readout-y" class="readout-value" data-axis="y"></span>
              <span class="readout-axis" data-axis="z"><span class="axis-line axis-line-z"></span>z</span><span id="readout-z" class="readout-value" data-axis="z"></span>
            </div>
            <div id="readout-answer" class="readout-answer"></div>
          </div>
        </div>

      </section>

      <aside id="summary" class="md-card md-card-flush summary" aria-label="Summary" hidden>
        <header class="md-card-head summary-head">
          <h2 class="md-card-title">Summary</h2>
        </header>
        <div class="summary-group">
          <h3 class="summary-group-title">Recording</h3>
          <dl id="facts-recording" class="facts"></dl>
        </div>
        <div class="summary-group">
          <h3 class="summary-group-title">Data quality</h3>
          <dl id="facts-quality" class="facts"></dl>
        </div>
      </aside>
    </div>
  </main>

  <script src="../../node_modules/uplot/dist/uPlot.iife.min.js"></script>
  <script src="../lib/chart.js"></script>
  <script src="plot.js"></script>
  <script src="answer_row.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
